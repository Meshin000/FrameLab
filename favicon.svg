<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- ダークモード対応背景 -->
  <defs>
    <style>
      @media (prefers-color-scheme: dark) {
        .frame-bg { fill: #1c1c1e; }
        .frame-border { stroke: #f2f2f0; }
      }
      @media (prefers-color-scheme: light) {
        .frame-bg { fill: #ffffff; }
        .frame-border { stroke: #1a1a1a; }
      }
    </style>
  </defs>

  <!-- フォトフレーム外枠 -->
  <rect class="frame-bg" width="32" height="32" rx="4"/>

  <!-- フレーム border -->
  <rect class="frame-border" x="3" y="3" width="26" height="26" rx="2" fill="none" stroke-width="1.5"/>

  <!-- 内側マット部分 -->
  <rect class="frame-border" x="6" y="6" width="20" height="14" rx="1" fill="none" stroke-width="1" opacity="0.5"/>

  <!-- 画像領域（グラデーション） -->
  <defs>
    <linearGradient id="photoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5aa3f0;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:0.3" />
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="20" height="14" rx="1" fill="url(#photoGrad)"/>

  <!-- 写真フレーム内のEXIF情報を示す小さな要素 -->
  <circle cx="10" cy="10" r="1.5" class="frame-border" fill="currentColor"/>
</svg>